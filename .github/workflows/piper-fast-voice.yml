name: Atlas Piper fast voice candidate

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/piper-fast-voice

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36 using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure persistent Atlas signing if secrets exist
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
        run: |
          if [[ -n "$ATLAS_KEYSTORE_BASE64" && -n "$ATLAS_STORE_PASSWORD"  ]]; then
            printf %s "$ATLAS_KEYSTORE_BASE64" | base64 --decode > atlas-signing.jks
            printf "storeFile=atlas-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$ATLAS_STORE_PASSWORD" "atlas-tts-signing" "$ATLAS_STORE_PASSWORD" > signing.properties
            echo "ATLAS_PERSISTENT_SIGNING=true" >> "$GITHUB_ENV"
            echo "Persistent signing enabled."
          else
            echo "::warning::Persistent signing secrets are not configured. This build is for compilation checks only; do NOT install its APK."
            echo "ATLAS_PERSISTENT_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Verify persistent signing key
        if: env.ATLAS_PERSISTENT_SIGNING == 'true'
        env:
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
        run: |
          keytool -list -keystore atlas-signing.jks -storetype PKCS12 -storepass "$ATLAS_STORE_PASSWORD" -alias atlas-tts-signing >/dev/null
      - name: Validate British Piper voice archives
        shell: bash
        run: |
          set -euo pipefail
          for voice in alan-medium southern_english_male-medium; do
            url="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_GB-${voice}.tar.bz2"
            echo "Checking $url"
            curl --fail --location --retry 3 --output "/tmp/${voice}.tar.bz2" "$url"
            tar -tjf "/tmp/${voice}.tar.bz2" | grep -E '(\.onnx$|tokens\.txt$|espeak-ng-data/)' | head -12
            tar -tjf "/tmp/${voice}.tar.bz2" | grep -q '\.onnx
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload experimental APK
        if: env.ATLAS_PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hayaitts-piper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

            tar -tjf "/tmp/${voice}.tar.bz2" | grep -q 'tokens.txt
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload experimental APK
        if: env.ATLAS_PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hayaitts-piper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

          done
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload experimental APK
        if: env.ATLAS_PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hayaitts-piper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
