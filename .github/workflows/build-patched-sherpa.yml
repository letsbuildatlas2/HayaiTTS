name: Build patched sherpa JNI and Atlas APK

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/native-callback-probe
    paths:
      - 'native/**'
      - '.github/workflows/build-patched-sherpa.yml'

permissions:
  contents: read

jobs:
  native-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Fetch exact sherpa-onnx source
        run: git clone --depth 1 --branch v1.13.2 https://github.com/k2-fsa/sherpa-onnx.git upstream-sherpa
      - name: Patch JNI callbacks
        run: |
          python3 native/patch_sherpa_jni_callbacks.py upstream-sherpa/sherpa-onnx/jni/offline-tts.cc
          grep -n 'vm->GetEnv' upstream-sherpa/sherpa-onnx/jni/offline-tts.cc
      - name: Compile patched arm64 JNI library
        working-directory: upstream-sherpa
        env:
          BUILD_SHARED_LIBS: 'ON'
          SHERPA_ONNX_ENABLE_TTS: 'ON'
          SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION: 'OFF'
          SHERPA_ONNX_ENABLE_BINARY: 'OFF'
          SHERPA_ONNX_ENABLE_C_API: 'OFF'
          SHERPA_ONNX_ENABLE_JNI: 'ON'
        run: |
          bash build-android-arm64-v8a.sh
          test -s build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so
      - name: Replace only arm64 JNI binary in existing AAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          aar = Path('app/libs/sherpa-onnx-1.13.2.aar')
          native = Path('upstream-sherpa/build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so')
          target = 'jni/arm64-v8a/libsherpa-onnx-jni.so'
          tmp = aar.with_suffix('.patched.aar')
          with ZipFile(aar) as src:
              entries = src.infolist()
              assert target in src.namelist(), f'Expected {target}; found {src.namelist()}'
              with ZipFile(tmp, 'w') as dst:
                  for info in entries:
                      dst.writestr(info, native.read_bytes() if info.filename == target else src.read(info.filename))
          os.replace(tmp, aar)
          print('Patched JNI size:', native.stat().st_size)
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure persistent Atlas signing
        env:
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
        run: |
          if [[ -n "$ATLAS_KEYSTORE_BASE64" && -n "$ATLAS_STORE_PASSWORD" ]]; then
            printf %s "$ATLAS_KEYSTORE_BASE64" | base64 --decode > atlas-signing.jks
            printf "storeFile=atlas-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$ATLAS_STORE_PASSWORD" "atlas-tts-signing" "$ATLAS_STORE_PASSWORD" > signing.properties
            echo "ATLAS_PERSISTENT_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets missing; APK is compilation-only and must not be installed."
            echo "ATLAS_PERSISTENT_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Build experimental APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload installable APK
        if: env.ATLAS_PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-patched-native-callback-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
